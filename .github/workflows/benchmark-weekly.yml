name: Benchmark — weekly update

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tool names to run (blank = all four)'
        required: false
        default: ''

# Run each tool in its own job so a failure in one tool doesn't starve the
# others out of a weekly update. The merge job at the end consolidates all
# successful results into one results.json and commits the update.
#
# Credibility note: every tool re-runs on the same weekly cadence. No tool
# gets stale relative to another. If you add a fifth tool, it belongs on
# this workflow — not on a separate manual trigger.

jobs:
  benchmark-vantage:
    name: VANTAGE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: cd packages/vantage-bench && npm install
      - name: Clone corpora
        run: |
          mkdir -p /tmp/vantage-bench
          git clone --depth 1 https://github.com/OWASP/NodeGoat.git     /tmp/vantage-bench/nodegoat
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git /tmp/vantage-bench/juiceshop
      - name: Run VANTAGE
        run: cd packages/vantage-bench && node bin/vantage-bench.js run --tool VANTAGE --output /tmp/results-vantage.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-vantage
          path: /tmp/results-vantage.json
          retention-days: 30

  benchmark-semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm install
      - run: cd packages/vantage-bench && npm install
      - name: Install Semgrep
        run: pip install semgrep --quiet
      - name: Clone corpora
        run: |
          mkdir -p /tmp/vantage-bench
          git clone --depth 1 https://github.com/OWASP/NodeGoat.git     /tmp/vantage-bench/nodegoat
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git /tmp/vantage-bench/juiceshop
      - name: Run Semgrep
        run: cd packages/vantage-bench && node bin/vantage-bench.js run --tool Semgrep --output /tmp/results-semgrep.json
      - uses: actions/upload-artifact@v4
        with:
          name: results-semgrep
          path: /tmp/results-semgrep.json
          retention-days: 30

  benchmark-codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: cd packages/vantage-bench && npm install
      - name: Install CodeQL CLI
        run: |
          curl -sL https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip -o /tmp/codeql.zip
          unzip -q /tmp/codeql.zip -d /opt
          echo "/opt/codeql" >> $GITHUB_PATH
      - name: Clone corpora
        run: |
          mkdir -p /tmp/vantage-bench
          git clone --depth 1 https://github.com/OWASP/NodeGoat.git     /tmp/vantage-bench/nodegoat
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git /tmp/vantage-bench/juiceshop
      - name: Run CodeQL
        run: cd packages/vantage-bench && node bin/vantage-bench.js run --tool CodeQL --output /tmp/results-codeql.json
        # CodeQL is slow and occasionally flakes; allow weekly run to continue without it
        # rather than silently dropping from the leaderboard. The stale-result detector
        # downstream will flag the run as stale.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: results-codeql
          path: /tmp/results-codeql.json
          retention-days: 30
        if: always()

  benchmark-sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/api/system/status | grep UP"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: cd packages/vantage-bench && npm install
      - name: Install sonar-scanner
        run: |
          curl -sL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip -o /tmp/sonar-scanner.zip
          unzip -q /tmp/sonar-scanner.zip -d /opt
          echo "/opt/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH
      - name: Clone corpora
        run: |
          mkdir -p /tmp/vantage-bench
          git clone --depth 1 https://github.com/OWASP/NodeGoat.git     /tmp/vantage-bench/nodegoat
          git clone --depth 1 https://github.com/juice-shop/juice-shop.git /tmp/vantage-bench/juiceshop
      - name: Run SonarQube
        env:
          SONAR_TOKEN: admin:admin
        run: cd packages/vantage-bench && node bin/vantage-bench.js run --tool SonarQube --output /tmp/results-sonarqube.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: results-sonarqube
          path: /tmp/results-sonarqube.json
          retention-days: 30
        if: always()

  merge-and-commit:
    name: Merge + commit results
    needs: [benchmark-vantage, benchmark-semgrep, benchmark-codeql, benchmark-sonarqube]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()  # run the merge even if one tool failed, so the leaderboard still updates
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/results
      - name: Merge into results.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outPath = 'sites/leaderboard/src/data/results.json';
          const existing = fs.existsSync(outPath)
            ? JSON.parse(fs.readFileSync(outPath, 'utf8'))
            : { tools: [], generatedAt: null };

          const resultsDir = '/tmp/results';
          const byName = new Map(existing.tools.map(t => [t.name, t]));

          for (const sub of fs.readdirSync(resultsDir)) {
            const f = path.join(resultsDir, sub, path.basename(sub).replace('results-', 'results-') + '.json');
            // Artifacts unzip as results-<tool>/<filename>; find any .json inside
            const dir = path.join(resultsDir, sub);
            const jsonFile = fs.readdirSync(dir).find(n => n.endsWith('.json'));
            if (!jsonFile) continue;
            let data;
            try {
              data = JSON.parse(fs.readFileSync(path.join(dir, jsonFile), 'utf8'));
            } catch (err) {
              console.error('Skipping malformed artifact', sub, err.message);
              continue;
            }
            for (const tool of (data.tools ?? [data])) {
              if (!tool || !tool.name) continue;
              byName.set(tool.name, tool);
            }
          }

          const merged = Array.from(byName.values())
            .sort((a, b) => (b.aggregateF1 ?? -1) - (a.aggregateF1 ?? -1));
          merged.forEach((t, i) => t.rank = i + 1);

          const out = {
            ...existing,
            tools: merged,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(outPath, JSON.stringify(out, null, 2));
          console.log('Merged', merged.length, 'tools into', outPath);
          NODE
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/leaderboard/src/data/results.json
          git diff --cached --quiet || git commit -m "chore: benchmark results $(date -u +%Y-%m-%d)"
          git push
